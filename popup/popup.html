<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Price Watch</h1>
      <button id="poll-now" title="Poll all now">↻</button>
    </header>
    <ul id="items"></ul>
    <template id="item-template">
      <li class="item">
        <img class="thumb" alt="" />
        <div class="body">
          <a class="title" target="_blank" rel="noopener"></a>
          <div class="prices">
            <span class="now"></span>
            <span class="delta"></span>
          </div>
          <div class="meta">
            <span class="vendor"></span>
            <span class="checked"></span>
          </div>
        </div>
        <button class="remove" title="Remove">✕</button>
      </li>
    </template>
    <script src="popup.js"></script>
  </body>
</html>
